name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # golangci-lint typechecks the stdlib SOURCE of the toolchain in PATH,
          # so it cannot analyse a Go newer than the one it was built with. Keep
          # this at the linter's build minor and bump both lines together; do not
          # set it back to `stable`, which breaks on the next Go release.
          go-version: '1.26'
      - uses: golangci/golangci-lint-action@v7
        with:
          # Pinned so a linter release cannot break CI on an unchanged tree.
          version: v2.12.2

  test:
    strategy:
      matrix:
        include:
          # Both the go.mod floor and the current release. The floor is the binding
          # constraint on what the source may use; the ceiling catches breakage from
          # a new toolchain, which the pinned lint job above can no longer see.
          - os: ubuntu-latest
            arch: x86_64
            go: '1.21'
          - os: ubuntu-latest
            arch: x86_64
            go: stable
          - os: ubuntu-24.04-arm
            arch: arm64
            go: '1.21'
          - os: ubuntu-24.04-arm
            arch: arm64
            go: stable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -v -race ./...
      - name: Benchmark
        run: go test -bench=. -benchmem -benchtime=1s ./...

  # The opt-in link mode rots unless both paths are built and their linkage checked
  # on the produced binary: -static-libstdc++ is silently ignored by a driver that
  # does not implement it, so a zero exit proves nothing. This is also where macOS
  # is covered, which the README's Xcode claim previously asserted untested.
  link-modes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        tags: ['', simdjson_static_cxx]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Test
        run: go test -count=1 -tags='${{ matrix.tags }}' ./...
      - name: Assert linkage and record size
        run: |
          set -o pipefail
          go test -c -tags='${{ matrix.tags }}' -o /tmp/sj.test . 2>&1 | tee /tmp/link.log
          echo "binary: $(wc -c < /tmp/sj.test) bytes (tags='${{ matrix.tags }}')"
          if [ "$(uname)" = Darwin ]; then
            otool -L /tmp/sj.test
            # libc++ is present whatever the tag, so asserting it proves nothing. The
            # regression worth catching is naming a runtime the c++ driver already
            # linked, which on darwin is what -lstdc++ does.
            if grep -q 'ignoring duplicate libraries' /tmp/link.log; then
              echo "link names a C++ runtime the driver already supplied"; exit 1
            fi
          else
            ldd /tmp/sj.test || true
            if [ -n '${{ matrix.tags }}' ]; then
              if ldd /tmp/sj.test | grep -q 'libstdc++'; then
                echo "static mode still links libstdc++"; exit 1
              fi
            elif ! ldd /tmp/sj.test | grep -q 'libstdc++'; then
              echo "dynamic mode does not link libstdc++"; exit 1
            fi
          fi

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # go test alone only replays each target's seed corpus. This actually mutates,
      # which is what reaches the malformed-tape and envelope paths.
      - name: Fuzz
        run: |
          for target in FuzzParse FuzzCorrect FuzzDeserialize FuzzTapeContract; do
            echo "::group::$target"
            go test -run='^$' -fuzz="^${target}\$" -fuzztime=60s .
            echo "::endgroup::"
          done
      # A crasher lives only in the runner's workspace, so without this the input
      # that found the bug is lost when the job ends.
      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashers
          path: testdata/fuzz/
          if-no-files-found: ignore

  test-cross-arch:
    strategy:
      matrix:
        include:
          - arch: ppc64le
            distro: ubuntu_latest
          - arch: s390x
            distro: ubuntu_latest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: uraimo/run-on-arch-action@v3
        name: Test on ${{ matrix.arch }}
        with:
          arch: ${{ matrix.arch }}
          distro: ${{ matrix.distro }}
          dockerRunArgs: --volume "${PWD}:/work"
          install: |
            apt-get update -q -y
            apt-get install -y golang-go gcc g++ zstd
          run: |
            cd /work
            go build ./...
            go test -count=1 ./...
